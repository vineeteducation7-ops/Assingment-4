<!DOCTYPE html>
<html>
<head>

    <title>Coffee Cafe Website</title>

    <style>

        body{
            margin:0;
            font-family:Arial;
            background:#f4f4f4;
        }

        /* Hero Section */

        .hero{
            position:relative;

            height:500px;

            background-image:url("https://picsum.photos/1200/500");
            background-size:cover;
            background-position:center;

            overflow:hidden;
        }

        .overlay{
            position:absolute;

            top:0;
            left:0;

            width:100%;
            height:100%;

            background:rgba(0,0,0,0.5);

            z-index:1;
        }

        .content{
            position:absolute;

            top:50%;
            left:50%;

            transform:translate(-50%,-50%);

            text-align:center;

            color:white;

            z-index:2;
        }

        .content h1{
            font-size:45px;
        }

        .content p{
            font-size:20px;
        }

        .btn{
            background:brown;
            color:white;

            padding:10px 20px;

            text-decoration:none;
            border-radius:5px;
        }

        /* About Section */

        .about{
            padding:20px;
            text-align:center;
        }

        .card{
            width:28%;

            display:inline-block;

            margin:10px;
            padding:15px;

            vertical-align:top;
        }

        .card1{
            border:2px solid black;
            background:white;
        }

        .card2{
            background:lightyellow;
            border-radius:20px;
        }

        .card3{
            background:white;
            border-radius:10px;
            box-shadow:0px 0px 10px gray;
        }

        /* Gallery */

        .gallery{
            padding:20px;
            text-align:center;
        }

        .gallery img{
            width:300px;
            height:200px;

            margin:10px;

            border:3px solid gray;
            border-radius:10px;
        }

        /* Contact */

        .contact{
            text-align:center;
            padding:20px;
        }

        input{
            width:60%;
            padding:10px;
            margin:10px;
        }

        textarea{
            width:60%;
            padding:10px;
            margin:10px;
        }

        button{
            padding:10px 20px;
            background:green;
            color:white;
            border:none;
        }

        /* Footer */

        .footer{
            background:#222;
            color:white;
            text-align:center;
            padding:20px;
        }

        .footer a{
            color:white;
            text-decoration:none;
            margin:10px;
        }

    </style>

</head>

<body>

<div class="hero">

    <div class="overlay"></div>

    <div class="content">

        <h1>Welcome To Coffee Cafe</h1>

        <p>Enjoy Fresh Coffee Every Day</p>

        <a href="#" class="btn">Order Now</a>

    </div>

</div>

<div class="about">

    <h2>Our Services</h2>

    <div class="card card1">
        <h3>Fresh Coffee</h3>
        <p>Fresh coffee made everyday.</p>
    </div>

    <div class="card card2">
        <h3>Fast Delivery</h3>
        <p>Quick delivery at your doorstep.</p>
    </div>

    <div class="card card3">
        <h3>Best Quality</h3>
        <p>Made from premium coffee beans.</p>
    </div>

</div>

<div class="gallery">

    <h2>Gallery</h2>

    <img src="https://picsum.photos/300/200?1">

    <img src="https://picsum.photos/300/200?2">

    <img src="https://picsum.photos/300/200?3">

</div>

<div class="contact">

    <h2>Contact Us</h2>

    <form>

        <input type="text" placeholder="Enter Name">

        <br>

        <input type="email" placeholder="Enter Email">

        <br>

        <textarea rows="5" placeholder="Message"></textarea>

        <br>

        <button>Submit</button>

    </form>

</div>

<div class="footer">

    <p>© 2026 Coffee Cafe</p>

    <a href="#">Home</a>
    <a href="#">Services</a>
    <a href="#">Gallery</a>
    <a href="#">Contact</a>

</div>

</body>
</html>
